<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }}</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; color: #222; }
h1 { font-size: 1.8rem; margin-bottom: 1rem; }
h2 { font-size: 1.4rem; margin-top: 2rem; }
a { color: #0070f3; text-decoration: none; }
a:hover { text-decoration: underline; }
article { margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid #eee; }
time { color: #888; font-size: 0.9rem; }
pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; border-radius: 8px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
</head>
<body>
<h1>{{ .Title }}</h1>
{{ range .Pages }}
<article>
  <time>{{ .Date.Format "2006-01-02" }}</time>
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p>{{ .Summary }}</p>
</article>
{{ end }}
</body>
</html>
