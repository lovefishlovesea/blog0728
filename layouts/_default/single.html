<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }}</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 980px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.7; color: #222; }
header { margin-bottom: 2rem; }
h1 { font-size: 2rem; margin: 0 0 0.5rem; }
time { color: #888; }
article img { max-width: 100%; }
pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; border-radius: 8px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
a { color: #0070f3; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<article>
  <header>
    <h1>{{ .Title }}</h1>
    <time>{{ .Date.Format "2006-01-02" }}</time>
  </header>
  {{ .Content }}
</article>
</body>
</html>
